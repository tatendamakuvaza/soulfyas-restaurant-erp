version: '3.8'

services:
  app:
    build: .
    container_name: soulfyas_erp
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///restaurant.db}
    volumes:
      - restaurant_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  restaurant_data:
